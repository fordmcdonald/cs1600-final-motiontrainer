<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Device Fusion Visualization</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      margin: 0;
      padding: 20px;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    
    .subtitle {
      text-align: center;
      opacity: 0.9;
      margin-bottom: 30px;
      font-size: 14px;
    }
    
    .status-bar {
      display: flex;
      justify-content: space-around;
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }
    
    .status-item {
      text-align: center;
    }
    
    .status-label {
      font-size: 12px;
      opacity: 0.8;
      margin-bottom: 5px;
    }
    
    .status-value {
      font-size: 24px;
      font-weight: bold;
    }
    
    .status-value.active {
      color: #4ade80;
      animation: pulse 2s infinite;
    }
    
    .status-value.inactive {
      color: #f87171;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    
    .motion-indicator {
      text-align: center;
      padding: 30px;
      margin: 20px auto;
      max-width: 400px;
      background: rgba(255,255,255,0.1);
      border-radius: 15px;
      backdrop-filter: blur(10px);
    }
    
    .motion-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 0 auto 20px;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      transition: all 0.3s ease;
    }
    
    .motion-circle.triggered {
      background: #4ade80;
      box-shadow: 0 0 30px rgba(74, 222, 128, 0.8);
      transform: scale(1.1);
    }
    
    .charts-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    
    .chart-wrapper {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
    }
    
    .chart-title {
      text-align: center;
      margin-bottom: 10px;
      font-weight: bold;
    }
    
    .device-list {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    
    .device-card {
      background: rgba(255,255,255,0.1);
      padding: 15px 25px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
      text-align: center;
      min-width: 150px;
    }
    
    .device-name {
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 16px;
    }
    
    .device-status {
      font-size: 12px;
      opacity: 0.8;
    }
    
    .device-delta {
      font-size: 20px;
      margin-top: 8px;
      font-weight: bold;
      color: #4ade80;
    }
  </style>
</head>
<body>
  <h1>🎯 Multi-Device Motion Fusion</h1>
  <div class="subtitle">Real-time sensor fusion for head-mounted IMUs</div>

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="status-item">
      <div class="status-label">Devices Active</div>
      <div class="status-value" id="device-count">0</div>
    </div>
    <div class="status-item">
      <div class="status-label">Calibration</div>
      <div class="status-value inactive" id="calibration-status">⏳</div>
    </div>
    <div class="status-item">
      <div class="status-label">Fusion Mode</div>
      <div class="status-value" id="fusion-mode">Maximum</div>
    </div>
    <div class="status-item">
      <div class="status-label">Motion Events</div>
      <div class="status-value" id="event-count">0</div>
    </div>
  </div>

  <!-- Motion Indicator -->
  <div class="motion-indicator">
    <div class="motion-circle" id="motion-circle">💤</div>
    <div id="motion-text">Waiting for motion...</div>
    <div style="margin-top: 10px; font-size: 12px; opacity: 0.7;">
      Fused ΔMag: <span id="fused-delta">0.000</span> m/s²
    </div>
  </div>

  <!-- Individual Device Status -->
  <div class="device-list" id="device-list">
    <!-- Populated dynamically -->
  </div>

  <!-- Charts -->
  <div class="charts-container">
    <div class="chart-wrapper">
      <div class="chart-title">Delta Magnitude Over Time</div>
      <canvas id="deltaChart"></canvas>
    </div>
    <div class="chart-wrapper">
      <div class="chart-title">Total Acceleration Magnitude</div>
      <canvas id="magnitudeChart"></canvas>
    </div>
  </div>

  <script src="./rendererFusion.js"></script>
</body>
</html>
